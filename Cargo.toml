[workspace]
resolver = "2"
members = [
  "apps/desktop/src-tauri",
  "crates/kiri-audio",
  "crates/kiri-capture",
  "crates/kiri-camera",
  "crates/kiri-credentials",
  "crates/kiri-input",
  "crates/kiri-jobs",
  "crates/kiri-persistence",
  "crates/kiri-project",
  "crates/kiri-settings",
]

[workspace.package]
edition = "2024"
license = "AGPL-3.0-or-later"
rust-version = "1.91"
version = "0.1.0"

[workspace.dependencies]
async-trait = "0.1.89"
chrono = { version = "0.4.42", features = ["serde"] }
keyring = { version = "3.6.3", features = ["windows-native"] }
rusqlite = { version = "0.37.0", features = ["bundled"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
tempfile = "3.23.0"
thiserror = "2.0.17"
tokio = { version = "1.48.0", features = ["macros", "rt", "sync"] }
uuid = { version = "1.18.1", features = ["serde", "v4"] }

